[project]
name = "whop-clipper"
version = "0.1.0"
description = "Agent that turns long-form source videos into campaign-compliant short clips for Whop Content Rewards campaigns."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "pydantic>=2.6",
    "faster-whisper>=1.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipper"]
