# Usually you don't write this by hand: `clipper go <brief-link>` creates it from the campaign brief.
# Edit it when the brief extraction got something wrong, then run:  clipper run campaigns/example.toml

name = "Example Podcast Clips"
brief_url = ""
creator = "Example Podcast (@examplepod)"
platforms = ["tiktok", "instagram_reels", "youtube_shorts"]

sources = [
  # "https://www.youtube.com/watch?v=...",   # YouTube, Drive, Dropbox, Frame.io, MediaSilo, or a local file
  # "~/Downloads/episode-42.mp4",
]
asset_links = []      # logo / watermark links
context_links = []    # blog posts etc. used for research

min_seconds = 20
max_seconds = 60
clips_per_source = 5

rules = [
  "Only use footage from the official episodes",
  "English only",
]
banned = [
  "Misleading or clickbait titles",
  "Added music",
]
required_caption_lines = ["@examplepod"]
disclosure_tag = "#Ad"          # placed first, on its own line
max_extra_hashtags = 3
on_screen_text_examples = []
language = "en"

layout = "blur"                 # "blur" = full frame over blurred background; "crop" = fill the screen
subtitles = "auto"              # auto = only clips with speech
show_hook = true
hook_seconds = 0                # 0 = on-screen text stays the whole clip
watermark = ""                  # path to logo PNG (filled automatically from asset_links if empty)
watermark_required = false
watermark_position = "top-right"
